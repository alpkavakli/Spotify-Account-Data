services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # Loads Spotify credentials if you've created Backend/.env. Optional so
    # `docker compose up` still works before you've set it up — the entrypoint
    # creates a blank .env from the example inside the container.
    env_file:
      - path: Backend/.env
        required: false
    # Your Spotify export + the generated spotify.db live on the host, mounted
    # in. Nothing personal is baked into the image.
    volumes:
      - ./Data:/app/Data
    restart: unless-stopped
